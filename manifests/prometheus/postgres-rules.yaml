apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  groups:
    - name: postgres.rules
      rules:
        - alert: PostgresConnectionsNearMax
          expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Postgres connections are approaching max_connections"
            description: "{{ $value | humanizePercentage }} of max_connections has been in use for more than 10 minutes."

        - alert: PostgresLowCacheHitRatio
          expr: |
            sum(rate(pg_stat_database_blks_hit[5m]))
              /
            (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))
              < 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Postgres cache hit ratio has dropped below 90%"
            description: "More reads are hitting disk than the buffer cache. Check for a new query pattern or an undersized shared_buffers."

        - alert: PostgresReplicationLagHigh
          expr: pg_replication_lag_seconds > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A Postgres replica is more than 30s behind"

        - alert: PostgresDeadTuplesHigh
          expr: pg_stat_user_tables_n_dead_tup > 100000
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "A table has a large dead-tuple backlog"
            description: "{{ $labels.datname }}.{{ $labels.relname }} has {{ $value }} dead tuples. Autovacuum may be falling behind."
