apiVersion: v1
kind: ConfigMap
metadata:
  name: watching-postgres-oss-dashboard
  namespace: monitoring
  labels:
    # kube-prometheus-stack's Grafana sidecar watches for this label
    # (see grafana.sidecar.dashboards in values/kube-prometheus-stack-values.yaml)
    # and loads any ConfigMap carrying it, cluster-wide.
    grafana_dashboard: "1"
data:
  watching-postgres-oss.json: |
    {
      "uid": "watching-postgres-oss",
      "title": "Watching Postgres (OSS)",
      "tags": ["postgres", "supabase", "watching-postgres-oss"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Connections",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(pg_stat_activity_count) / max(pg_settings_max_connections) * 100",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Cache hit ratio",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m]))) * 100",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 90 },
                  { "color": "green", "value": 95 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Replication lag",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(pg_replication_lag_seconds)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 5 },
                  { "color": "red", "value": 30 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Dead tuples",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(pg_stat_user_tables_n_dead_tup)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 50000 },
                  { "color": "red", "value": 100000 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Slow queries >500ms",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "count(rate(pg_stat_statements_seconds_total[5m]) / clamp_min(rate(pg_stat_statements_calls_total[5m]), 1e-9) > 0.5) OR vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Connections vs. max_connections",
          "gridPos": { "x": 0, "y": 6, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(pg_stat_activity_count)",
              "legendFormat": "connections",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max(pg_settings_max_connections)",
              "legendFormat": "max_connections",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        }
      ]
    }
